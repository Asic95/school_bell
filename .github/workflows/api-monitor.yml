name: Air Alert API Monitor

on:
  schedule:
    # 20:00 UTC = 23:00 Kyiv Time
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'Імітувати збій (для перевірки сповіщення на пошту)'
        type: boolean
        required: false
        default: false

jobs:
  check-api-health:
    name: Check Live Alert API Schema
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Simulate failure (Test notification)
        if: ${{ inputs.simulate_failure == true }}
        run: |
          echo "::error title=Simulated API Failure::Тестовий збій моніторингу для перевірки email-сповіщення."
          echo "### ⚠️ Тестовий збій моніторингу API" >> $GITHUB_STEP_SUMMARY
          echo "Цей запуск було здійснено вручну з увімкненим параметром **simulate_failure** для перевірки сповіщень." >> $GITHUB_STEP_SUMMARY
          exit 1

      - name: Run Live API Schema Test
        if: ${{ inputs.simulate_failure != true }}
        run: mvn test -Dtest=AirAlertApiLiveTest
